<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ukulélé — programme d'apprentissage (prototype)</title>
<meta name="description" content="Programme d'apprentissage du ukulélé pour adultes, par compétences, sans limite : expérimentation, défis quotidiens, morceaux multi-niveaux." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#1f3a6b;--navy-deep:#142546;--teal:#1ea7a0;--yellow:#f5b820;--orange:#ee5a2a;
  --lime:#a7c842;--sky:#5fa8d6;--cream:#fbf8f1;--paper:#fff;--ink:#0e1a33;--ink-2:#404a66;
  --ink-3:#7a849c;--line:rgba(20,37,70,.10);--sand:#f3e9d6;--leaf:#2f8f6b;--sun:#e8933a;
  --coral:#ef6f53;--violet:#6b5ca8;--radius:18px;
  --shadow:0 18px 50px -24px rgba(20,37,70,.35);--shadow-sm:0 6px 20px -10px rgba(20,37,70,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--cream);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none;cursor:pointer}
.serif{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* NAV */
.unav{position:sticky;top:0;z-index:60;background:rgba(251,248,241,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.unav-in{display:flex;align-items:center;justify-content:space-between;height:66px;gap:14px}
.ubrand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--navy-deep)}
.ubrand .g{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--coral),var(--sun));display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow-sm)}
.unav-r{display:flex;align-items:center;gap:12px}
.uxp{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;background:var(--paper);border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:13.5px;color:var(--navy-deep);box-shadow:var(--shadow-sm)}
.uxp svg{width:16px;height:16px}
.ubtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;background:var(--navy-deep);color:#fff;border:none;border-radius:99px;font-weight:600;font-size:13.5px;transition:background .18s}
.ubtn:hover{background:var(--coral)}
.ubtn.ghost{background:var(--paper);color:var(--navy-deep);border:1px solid var(--line)}
.ubtn.ghost:hover{background:var(--navy-deep);color:#fff}

/* SCREEN */
#screen{min-height:60vh;padding:30px 0 70px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:var(--lime);border-radius:99px;font-size:12px;font-weight:600;color:var(--navy-deep);text-transform:uppercase;letter-spacing:.06em}
.eyebrow.alt{background:var(--sand);color:var(--ink-2)}
h1.big{font-weight:500;font-size:clamp(32px,5.5vw,60px);line-height:1;letter-spacing:-.03em;color:var(--navy-deep);margin:16px 0 14px;text-wrap:balance}
h1.big .ac{color:var(--coral)}
.lead{font-size:18px;color:var(--ink-2);max-width:640px}
.lead strong{color:var(--navy-deep);font-weight:600}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:38px 0 8px}
.sect-h h2{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--navy-deep)}
.sect-h .n{font-family:"Instrument Serif",serif;font-style:italic;font-size:20px;color:var(--coral)}
.sect-h .hint{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
p.para{font-size:16px;color:var(--ink-2);margin:10px 0}

/* placement banner */
.place-cta{margin-top:26px;background:linear-gradient(135deg,var(--navy-deep),#24406f);color:#fff;border-radius:var(--radius);padding:24px 26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}
.place-cta h3{font-size:20px;margin-bottom:4px}
.place-cta p{font-size:14.5px;color:rgba(255,255,255,.8);max-width:520px}
.place-cta .ubtn{background:var(--yellow);color:var(--navy-deep)}
.place-cta .ubtn:hover{background:#fff}

/* XP strip */
.xpstrip{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 24px;display:flex;gap:30px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-sm)}
.xpstat .num{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--navy-deep);line-height:1}
.xpstat .num .inf{color:var(--coral)}
.xpstat .lbl{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:2px}
.xpstrip .reset{margin-left:auto;background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;cursor:pointer}
.xpstrip .reset:hover{color:var(--coral)}

/* competence grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:14px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.ccard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,var(--teal))}
.ccard.live{cursor:pointer}
.ccard.live:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ccard.soon{opacity:.62}
.ccard .ic{font-size:26px;margin-bottom:8px}
.ccard h3{font-size:17px;font-weight:600;color:var(--navy-deep);line-height:1.2}
.ccard .cshort{font-size:13px;color:var(--ink-2);margin:5px 0 12px}
.ccard .pal{font-size:12px;font-weight:600;color:var(--c,var(--teal));text-transform:uppercase;letter-spacing:.04em}
.ccard .pal .evo{color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0}
.cbar{height:8px;border-radius:99px;background:var(--sand);overflow:hidden;margin-top:7px}
.cbar>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--teal));transition:width .5s}
.ccard .soonlbl{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--sand);padding:4px 10px;border-radius:99px}

/* piece cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .18s,box-shadow .18s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:99px;background:rgba(30,167,160,.14);color:var(--teal)}
.pcard .tag.orig{background:rgba(239,111,83,.14);color:var(--coral)}
.pcard h3{font-size:19px;font-weight:600;color:var(--navy-deep);margin:9px 0 3px}
.pcard .meta{font-size:13px;color:var(--ink-3)}
.pcard .levels{display:flex;gap:5px;margin-top:12px}
.pcard .lv{flex:1;text-align:center;font-size:12px;font-weight:600;padding:6px 0;border-radius:8px;background:var(--sand);color:var(--ink-3)}
.pcard .lv.ok{background:rgba(47,143,107,.16);color:var(--leaf)}

/* defi card */
.defi-feature{margin-top:14px;background:linear-gradient(135deg,#fff,var(--sand));border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow-sm)}
.defi-feature .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--coral)}
.defi-feature h3{font-size:21px;color:var(--navy-deep);margin:6px 0 4px}
.timefilter{display:flex;gap:8px;margin:14px 0}
.timefilter button{padding:8px 16px;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.timefilter button.on{border-color:var(--coral);background:var(--coral);color:#fff}

/* generic cards / detail */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow-sm);margin:16px 0}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--navy-deep);margin-bottom:6px}
.back:hover{color:var(--coral)}
.detail-h{font-size:clamp(26px,4vw,40px);font-weight:500;letter-spacing:-.02em;color:var(--navy-deep);line-height:1.05;margin:10px 0 10px}
.goalrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink-2)}
.pill b{color:var(--navy-deep)}

/* level list */
.level{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0;background:var(--paper);transition:border-color .2s}
.level.done{border-color:rgba(47,143,107,.4);background:rgba(47,143,107,.05)}
.level.locked{opacity:.55}
.level-top{display:flex;align-items:center;gap:12px}
.level-n{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:var(--c,var(--teal));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.level.done .level-n{background:var(--leaf)}
.level h4{font-size:17px;font-weight:600;color:var(--navy-deep)}
.level .lgoal{font-size:13.5px;color:var(--ink-3)}
.level .badge{margin-left:auto;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}
.level .badge.d{background:rgba(47,143,107,.16);color:var(--leaf)}
.level .badge.c{background:rgba(239,111,83,.14);color:var(--coral)}
.level .badge.l{background:var(--sand);color:var(--ink-3)}
.level-body{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.level-body p{font-size:15px;color:var(--ink-2);margin:8px 0}
.level-body ul{margin:8px 0 8px 20px}.level-body li{font-size:15px;color:var(--ink-2);margin:5px 0}
.level-body strong{color:var(--navy-deep)}

.do-btn{display:inline-flex;align-items:center;gap:9px;margin-top:10px;padding:12px 22px;background:var(--navy-deep);color:#fff;border:none;border-radius:99px;font-weight:600;font-size:14.5px;transition:background .18s}
.do-btn:hover{background:var(--coral)}
.do-btn.ok{background:var(--leaf)}

/* chord + tab */
.chordrow{display:flex;flex-wrap:wrap;gap:20px;margin:18px 0;align-items:flex-start}
.chord{width:100px;text-align:center}
.chord .cn{font-weight:600;font-size:15px;color:var(--navy-deep)}
.chord .cn .fr{color:var(--coral);font-style:italic;font-family:"Instrument Serif",serif;font-size:16px}
.chord .csub{font-size:11px;color:var(--ink-3);min-height:14px;margin-bottom:6px}
.chord svg{margin:0 auto;filter:drop-shadow(0 6px 14px rgba(20,37,70,.12))}
.chord .play{margin-top:7px;font-size:12px;font-weight:600;color:var(--teal);background:rgba(30,167,160,.1);border:none;border-radius:99px;padding:5px 12px}
.chord .play:hover{background:var(--teal);color:#fff}

.tab{background:var(--navy-deep);border-radius:14px;padding:18px 20px;margin:16px 0;overflow-x:auto}
.tab .tt{font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:10px}
.tabgrid{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#fff;font-size:14px;min-width:420px}
.tabline{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;line-height:1.9}
.tabline .s{color:var(--yellow);font-weight:700}
.tabcells{display:flex;gap:2px}
.tabcells .c{flex:1;text-align:center;color:rgba(255,255,255,.9);border-bottom:1px solid rgba(255,255,255,.18)}
.tabcells .c.hit{color:var(--yellow);font-weight:700}

/* strum pattern */
.strum{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.strum .b{width:46px;height:52px;border-radius:10px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--ink-3)}
.strum .b.d{border-color:var(--coral);color:var(--coral)}
.strum .b.u{border-color:var(--teal);color:var(--teal)}
.strum .b small{display:block;font-size:9px;font-weight:600;color:var(--ink-3);text-transform:uppercase}

/* metronome */
.metro{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow-sm)}
.metro-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.metro .dots{display:flex;gap:8px}
.metro .dot{width:16px;height:16px;border-radius:50%;background:var(--sand);transition:background .05s,transform .05s}
.metro .dot.on{background:var(--coral);transform:scale(1.25)}
.metro .dot.acc.on{background:var(--yellow)}
.metro .bpm{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--navy-deep);min-width:76px}
.metro input[type=range]{flex:1;accent-color:var(--coral);min-width:140px}
.metro .mstart{padding:10px 20px;background:var(--navy-deep);color:#fff;border:none;border-radius:99px;font-weight:600;font-size:14px}
.metro .mstart.on{background:var(--coral)}

/* callout */
.call{display:flex;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c,var(--teal));border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow-sm)}
.call .i{font-size:20px}.call h4{font-size:15px;color:var(--navy-deep);margin-bottom:2px}.call p{font-size:14px;color:var(--ink-2)}
.call.warn{border-left-color:var(--orange)}.call.tip{border-left-color:var(--leaf)}.call.ear{border-left-color:var(--violet)}

/* notions table */
.ntable{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:14.5px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ntable th{background:var(--navy-deep);color:#fff;text-align:left;padding:11px 14px;font-size:13px}
.ntable td{padding:11px 14px;border-top:1px solid var(--line);color:var(--ink-2)}
.ntable td b{color:var(--navy-deep)}

/* placement test */
.q{padding:18px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:none}
.q .qt{font-size:16px;font-weight:600;color:var(--navy-deep);margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;font-size:14.5px;color:var(--ink-2)}
.opt:hover{border-color:var(--coral)}
.opt input{accent-color:var(--coral)}

/* result / toast */
.result{margin-top:18px;border-radius:14px;padding:20px 22px;background:linear-gradient(135deg,rgba(47,143,107,.14),rgba(30,167,160,.1));border:1px solid rgba(47,143,107,.3);display:none}
.result.show{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy-deep);color:#fff;padding:13px 20px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:200;display:flex;gap:9px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast svg{width:17px;height:17px}

.ufoot{background:var(--navy-deep);color:rgba(255,255,255,.7);padding:30px 0;font-size:13px;margin-top:20px}
.ufoot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.proto{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:var(--coral);background:rgba(239,111,83,.12);padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
@media(max-width:640px){.wrap{padding:0 18px}.sect-h .hint{display:none}}

/* ===== Démos animées ===== */
.demo-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin:14px 0;padding:14px 16px;background:var(--cream);border:1px solid var(--line);border-radius:12px}
.demo-wrap.rhythm{flex-direction:column}
.demo-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.demo-photo{width:176px;height:132px;object-fit:cover;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.demo-cap{font-size:11px;color:var(--ink-3);text-align:center;max-width:180px}
.demo-fret{width:120px;height:152px}
.demo-strings{width:100%;max-width:360px;height:auto}
.demo-btn{margin-top:3px;padding:8px 16px;background:var(--navy-deep);color:#fff;border:none;border-radius:99px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;transition:background .18s}
.demo-btn:hover{background:var(--coral)}
.demo-btn.on{background:var(--coral)}

.comp-cover{width:100%;max-height:190px;object-fit:cover;border-radius:16px;margin:6px 0 10px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
</style>
</head>
<body>

<nav class="unav">
  <div class="wrap unav-in">
    <div class="ubrand" onclick="UKE.go('dash')"><span class="g">🪕</span> Ukulélé · Método <span class="proto">prototype</span></div>
    <div class="unav-r">
      <span class="uxp" id="xpBadge"></span>
      <button class="ubtn ghost" onclick="UKE.go('dash')">Tableau de bord</button>
    </div>
  </div>
</nav>

<main class="wrap"><div id="screen"></div></main>

<footer class="ufoot"><div class="wrap">
  <span>Ukulélé · Método — prototype d'architecture (compétences, sans plafond) 🌴</span>
  <span>L'expérimentation au cœur.</span>
</div></footer>

<script>
/* ============================================================
   UKULÉLÉ — moteur prototype
   Architecture ouverte par compétences (sans limite numérique)
   ============================================================ */
(function(){
"use strict";

/* ---------- Audio (Web Audio, sans fichier externe) ---------- */
let actx=null;
function AC(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;} } if(actx&&actx.state==="suspended")actx.resume(); return actx; }
// fréquences cordes à vide (GCEA, high G)
const OPEN={G:392.00,C:261.63,E:329.63,A:440.00};
function freq(string,fret){ return OPEN[string]*Math.pow(2,fret/12); }
// Karplus-Strong : son de corde pincée
function pluck(f,when,dur,gainv){
  const ac=AC(); if(!ac)return; dur=dur||1.3; gainv=gainv||0.22;
  const sr=ac.sampleRate, N=Math.max(1,Math.round(sr*dur)), buf=ac.createBuffer(1,N,sr), d=buf.getChannelData(0);
  const p=Math.max(2,Math.round(sr/f)), ring=new Float32Array(p);
  for(let i=0;i<p;i++) ring[i]=Math.random()*2-1;
  let idx=0; const decay=0.9965;
  for(let i=0;i<N;i++){ const cur=ring[idx], nxt=ring[(idx+1)%p], avg=(cur+nxt)*0.5*decay; d[i]=cur; ring[idx]=avg; idx=(idx+1)%p; }
  // léger fondu de fin
  const fade=Math.min(N,Math.round(sr*0.08)); for(let i=0;i<fade;i++) d[N-1-i]*= i/fade;
  const src=ac.createBufferSource(); src.buffer=buf; const g=ac.createGain(); g.gain.value=gainv;
  src.connect(g); g.connect(ac.destination); src.start(when||ac.currentTime);
}
function strum(frets){ // frets = {G,C,E,A} (null = corde non jouée)
  const ac=AC(); if(!ac)return; const order=["G","C","E","A"]; let t=ac.currentTime+0.02;
  order.forEach(s=>{ const fr=frets[s]; if(fr!==null&&fr!==undefined){ pluck(freq(s,fr),t,1.4); t+=0.035; } });
}

function animFret(svg){
  const nF=4,W=120,H=152,padX=22,padTop=18,padB=22,gw=W-padX*2,gh=H-padTop-padB,dx=gw/3,dy=gh/nF;
  let s=`<rect x="${padX}" y="${padTop-3}" width="${gw}" height="3.4" rx="1.6" fill="#142546"/>`;
  for(let f=0;f<=nF;f++)s+=`<line x1="${padX}" y1="${padTop+f*dy}" x2="${padX+gw}" y2="${padTop+f*dy}" stroke="#c9cfda" stroke-width="1.4"/>`;
  for(let i=0;i<4;i++){s+=`<line id="${svg.id}-v${i}" x1="${padX+i*dx}" y1="${padTop}" x2="${padX+i*dx}" y2="${padTop+gh}" stroke="#c9cfda" stroke-width="1.6"/>`;
    s+=`<text x="${padX+i*dx}" y="${H-6}" font-size="10" fill="#7a849c" text-anchor="middle" font-weight="600">${UORD[i]}</text>`;}
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.innerHTML=s;svg._g={padX,padTop,dx,dy};
}
function dropDot(svg,i,fr){
  const g=svg._g,x=g.padX+i*g.dx,ty=g.padTop+(fr-0.5)*g.dy,sy=g.padTop-26;
  const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("cx",x);dot.setAttribute("r",8);dot.setAttribute("fill","#ef6f53");dot.setAttribute("cy",sy);svg.appendChild(dot);
  const t0=performance.now();
  (function st(now){const k=Math.min(1,(now-t0)/450),e=1-Math.pow(1-k,3);dot.setAttribute("cy",sy+e*(ty-sy));if(k<1)requestAnimationFrame(st);})(t0);
}
function flashV(svg,i){const l=document.getElementById(svg.id+"-v"+i);if(!l)return;l.setAttribute("stroke","#1ea7a0");l.setAttribute("stroke-width","2.6");setTimeout(function(){l.setAttribute("stroke","#c9cfda");l.setAttribute("stroke-width","1.6");},450);}
function playFingerDemo(uid,frets){
  const svg=document.getElementById(uid);if(!svg)return;animFret(svg);AC();
  UORD.forEach(function(s,i){const fr=frets[s];if(fr>0)dropDot(svg,i,fr);});
  setTimeout(function(){strum(frets);UORD.forEach(function(s,i){if(frets[s]>=0)setTimeout(function(){flashV(svg,i);},i*45);});},720);
}

/* --- cordes horizontales : mécanique du bras + vibration --- */
function animRows(svg){
  const padL=34,top=22,gap=26,W=340,right=W-46;
  let s="";UORD.forEach(function(n,i){const y=top+i*gap;s+=`<path id="${svg.id}-h${i}" d="M${padL} ${y} L${right} ${y}" stroke="#c9cfda" stroke-width="2" fill="none"/>`;s+=`<text x="16" y="${y+4}" font-size="11" fill="#7a849c" font-weight="700" text-anchor="middle">${n}</text>`;});
  svg.setAttribute("viewBox","0 0 "+W+" "+(top+3*gap+22));svg.innerHTML=s;svg._g={padL,right,top,gap,W};
  const h=document.createElementNS("http://www.w3.org/2000/svg","g");
  h.innerHTML=`<rect x="-15" y="-12" width="30" height="24" rx="8" fill="#ef6f53"/><text x="0" y="5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" id="${svg.id}-arrow">↓</text>`;
  h.setAttribute("transform","translate("+(W-20)+","+top+")");h.style.transition="transform .15s linear";h.id=svg.id+"-hand";svg.appendChild(h);
}
function vibH(svg,i,color){const path=document.getElementById(svg.id+"-h"+i);if(!path)return;const g=svg._g,y=g.top+i*g.gap,x0=g.padL,x1=g.right,len=x1-x0,t0=performance.now(),dur=560,amp=6;
  (function st(now){const k=(now-t0)/dur;if(k>=1){path.setAttribute("d","M"+x0+" "+y+" L"+x1+" "+y);path.setAttribute("stroke","#c9cfda");path.setAttribute("stroke-width","2");return;}const env=(1-k)*amp;let d="M"+x0+" "+y;for(let j=1;j<=14;j++){const xx=x0+len*j/14,yy=y+Math.sin((j/14)*Math.PI*3+now/30)*env*Math.sin(Math.PI*j/14);d+=" L"+xx.toFixed(1)+" "+yy.toFixed(1);}path.setAttribute("d",d);path.setAttribute("stroke",color);path.setAttribute("stroke-width","2.4");requestAnimationFrame(st);})(t0);}
let activeStrum=null;
function stopStrum(){if(!activeStrum)return;clearTimeout(activeStrum.timer);if(activeStrum.btn){activeStrum.btn.textContent="▶ Démo (son)";activeStrum.btn.classList.remove("on");}activeStrum=null;}
function toggleStrumDemo(uid,pat,bpm){
  const svg=document.getElementById(uid);if(!svg)return;
  if(activeStrum&&activeStrum.uid===uid){stopStrum();return;}
  if(activeStrum)stopStrum();
  AC();animRows(svg);
  const DOc={G:0,C:0,E:0,A:3},g=svg._g,hand=document.getElementById(svg.id+"-hand"),arrow=document.getElementById(svg.id+"-arrow");
  let pos=0;
  activeStrum={uid:uid,timer:null,btn:document.querySelector('[data-strum-demo="'+uid+'"]')};
  if(activeStrum.btn){activeStrum.btn.textContent="■ Stop";activeStrum.btn.classList.add("on");}
  function tick(){const eighth=(60/bpm)/2*1000,down=pos%2===0,topY=g.top-4,botY=g.top+3*g.gap+4;
    hand.style.transitionDuration=(eighth*0.9)/1000+"s";hand.setAttribute("transform","translate("+(g.W-20)+","+(down?botY:topY)+")");if(arrow)arrow.textContent=down?"↓":"↑";
    if(pat[pos]){const order=down?[0,1,2,3]:[3,2,1,0];setTimeout(function(){order.forEach(function(i,n){setTimeout(function(){vibH(svg,i,"#ef6f53");},n*40);});const ac=AC();let t=ac?ac.currentTime+0.01:0;(down?["G","C","E","A"]:["A","E","C","G"]).forEach(function(s,n){pluck(freq(s,DOc[s]),t+n*0.03,1.3,0.17);});},eighth*0.4);}
    pos=(pos+1)%pat.length;if(activeStrum)activeStrum.timer=setTimeout(tick,eighth);}
  tick();
}

function wireDemos(root){
  (root||document).querySelectorAll("[data-finger]").forEach(function(b){const svg=document.getElementById(b.dataset.finger);if(svg&&!svg._g)animFret(svg);b.onclick=function(){playFingerDemo(b.dataset.finger,JSON.parse(b.dataset.frets));};});
  (root||document).querySelectorAll("[data-strum-demo]").forEach(function(b){const svg=document.getElementById(b.dataset.strumDemo);if(svg&&!svg._g)animRows(svg);b.onclick=function(){toggleStrumDemo(b.dataset.strumDemo,JSON.parse(b.dataset.pat),+b.dataset.bpm);};});
}


/* ---------- Métronome ---------- */
const metro={on:false,bpm:80,next:0,beat:0,timer:null};
function metroStart(){ const ac=AC(); if(!ac)return; metro.on=true; metro.next=ac.currentTime+0.1; metro.beat=0; metroLoop(); }
function metroStop(){ metro.on=false; if(metro.timer)clearTimeout(metro.timer); document.querySelectorAll(".metro .dot").forEach(d=>d.classList.remove("on")); }
function metroLoop(){
  const ac=AC(); if(!ac||!metro.on)return;
  while(metro.next < ac.currentTime+0.12){
    const t=metro.next, acc=(metro.beat%4===0);
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=acc?1500:1050; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(acc?0.4:0.25,t+0.001); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.start(t); o.stop(t+0.06);
    const b=metro.beat%4, delay=(t-ac.currentTime)*1000;
    setTimeout(()=>{ const dots=document.querySelectorAll(".metro .dot"); dots.forEach(d=>d.classList.remove("on")); if(dots[b])dots[b].classList.add("on"); },Math.max(0,delay));
    metro.beat++; metro.next += 60/metro.bpm;
  }
  metro.timer=setTimeout(metroLoop,25);
}

/* ---------- Rendu : diagramme d'accord ukulélé (4 cordes) ---------- */
function chordSVG(ch,color){
  const strings=["G","C","E","A"], nF=4, W=78,H=104,padX=11,padTop=22,padB=10;
  const gw=W-padX*2, gh=H-padTop-padB, dx=gw/(strings.length-1), dy=gh/nF;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accord ${ch.en}">`;
  s+=`<rect x="${padX}" y="${padTop-3}" width="${gw}" height="3.4" rx="1.4" fill="#142546"/>`;
  for(let f=0;f<=nF;f++) s+=`<line x1="${padX}" y1="${padTop+f*dy}" x2="${padX+gw}" y2="${padTop+f*dy}" stroke="#c9cfda" stroke-width="1.3"/>`;
  for(let i=0;i<strings.length;i++) s+=`<line x1="${padX+i*dx}" y1="${padTop}" x2="${padX+i*dx}" y2="${padTop+gh}" stroke="#c9cfda" stroke-width="1.3"/>`;
  strings.forEach((str,i)=>{
    const fr=ch.frets[str], x=padX+i*dx;
    if(fr===0){ s+=`<circle cx="${x}" cy="${padTop-10}" r="4" fill="none" stroke="#404a66" stroke-width="1.5"/>`; }
    else if(fr>0 && fr<=nF){ const y=padTop+(fr-0.5)*dy; s+=`<circle cx="${x}" cy="${y}" r="7" fill="${color||"#1ea7a0"}"/>`;
      const fg=ch.fingers&&ch.fingers[str]; if(fg) s+=`<text x="${x}" y="${y+3.4}" font-size="9" font-family="Space Grotesk" fill="#fff" text-anchor="middle" font-weight="700">${fg}</text>`; }
  });
  // labels cordes
  strings.forEach((str,i)=>{ s+=`<text x="${padX+i*dx}" y="${H-1}" font-size="7.5" font-family="Space Grotesk" fill="#7a849c" text-anchor="middle" font-weight="600">${str}</text>`; });
  s+=`</svg>`; return s;
}
function chordBlock(ch,color){
  const fr=JSON.stringify(ch.frets).replace(/"/g,"&quot;");
  return `<div class="chord"><div class="cn">${ch.name} <span class="fr">${ch.en}</span></div><div class="csub">${ch.sub||""}</div>${chordSVG(ch,color)}<button class="play" data-strum='${fr}'>▶ écouter</button></div>`;
}

/* ---------- Rendu : tablature ---------- */
function tabBlock(steps){
  const strings=["A","E","C","G"]; // ordre d'affichage (aigu en haut)
  let rows="";
  strings.forEach(str=>{
    let cells="";
    steps.forEach(stp=>{ const v=(stp[str]!==undefined&&stp[str]!==null)?stp[str]:null; cells+=`<span class="c ${v!==null?"hit":""}">${v!==null?v:"–"}</span>`; });
    rows+=`<div class="tabline"><span class="s">${str}</span><div class="tabcells">${cells}</div></div>`;
  });
  // ligne des noms de notes si fournis
  let names=""; if(steps.some(s=>s.lbl)){ let c=""; steps.forEach(s=>{ c+=`<span class="c">${s.lbl||""}</span>`; }); names=`<div class="tabline"><span class="s"></span><div class="tabcells" style="color:var(--yellow)">${c}</div></div>`; }
  return `<div class="tab"><div class="tt">🎼 Tablature (chiffres = cases, – = corde non jouée)</div><div class="tabgrid">${rows}${names}</div></div>`;
}

/* ---------- Rendu : rythmique ---------- */
function strumBlock(pat){
  let b=""; pat.forEach((p,i)=>{
    const beat=(i%2===0)?Math.floor(i/2)+1:"&";
    if(p==="D") b+=`<div class="b d">↓<small>${beat}</small></div>`;
    else if(p==="U") b+=`<div class="b u">↑<small>${beat}</small></div>`;
    else b+=`<div class="b"><small>${beat}</small></div>`;
  });
  return `<div class="strum">${b}</div><p class="para" style="font-size:13.5px;color:var(--ink-3)">↓ coup vers le bas · ↑ coup vers le haut · case vide = on saute (silence)</p>`;
}

/* ---------- Rendu : métronome ---------- */
function metroBlock(bpm){
  return `<div class="metro" data-metro><div class="metro-top">
    <button class="mstart" data-mstart>▶ Démarrer</button>
    <div class="dots"><div class="dot acc"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <span class="bpm" data-bpmv>${bpm}</span>
    <input type="range" min="40" max="160" value="${bpm}" data-bpm>

}

/* ---------- Progression ---------- */
function compLevel(id){ const s=st(); return (s.comps[id]&&s.comps[id].lvl)||0; }
function setCompLevel(id,lvl){ const s=st(); if(!s.comps[id])s.comps[id]={lvl:0}; if(lvl>s.comps[id].lvl)s.comps[id].lvl=lvl; save(s); }
function addXP(n){ const s=st(); s.xp=(s.xp||0)+n; save(s); }
function markDone(key){ const s=st(); s.done[key]=true; save(s); }
function isDone(key){ return !!st().done[key]; }
function totalStars(){ return st().xp||0; }

function paintXP(){ const el=document.getElementById("xpBadge"); if(el) el.innerHTML=starSVG()+`<span>${totalStars()} ★ <span style="color:var(--coral)">∞</span></span>`; }
function starSVG(){ return `<svg viewBox="0 0 24 24" fill="#f5b820"><path d="M12 2.5l2.9 6.05 6.6.86-4.85 4.55 1.24 6.54L12 17.9 6.1 20.9l1.24-6.54L2.5 9.41l6.6-.86z"/></svg>`; }

function toast(msg){ let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);} t.innerHTML=starSVG()+`<span>${msg}</span>`; requestAnimationFrame(()=>t.classList.add("show")); setTimeout(()=>t.classList.remove("show"),3000); }

/* ----- défi du jour ----- */
function pickDefi(maxMin){
  // réservoir = tous les défis des compétences live, filtrés par temps et proches du niveau
  const pool=[];
  COMPS.filter(c=>c.live).forEach(c=>{ c.levels.forEach(l=>{ if(l.defi){ pool.push({comp:c,lvl:l,key:c.id+":"+l.n}); } }); });
  const lim=pool.filter(d=>d.lvl.defi.min<=maxMin);
  // priorité : défis au niveau courant ou juste au-dessus, non faits
  const cur=lim.filter(d=>!isDone("defi:"+d.key) && d.lvl.n<=compLevel(d.comp.id)+1);
  const chosen=(cur.length?cur:lim);
  return chosen[Math.floor(Math.random()*chosen.length)];
}
function mountDefi(mount,maxMin){
  const d=pickDefi(maxMin);
  if(!d){ mount.innerHTML=`<div class="defi-feature"><p class="para">Tous les défis de ce format sont validés — essaie une durée plus longue !</p></div>`; return; }
  const done=isDone("defi:"+d.key);
  mount.innerHTML=`<div class="defi-feature">
    <span class="tag">Défi · ${d.comp.ic} ${d.comp.name}</span>
    <h3>${d.lvl.title}</h3>
    <div class="timefilter">
      ${[3,5,10].map(m=>`<button class="${m===maxMin?'on':''}" data-time="${m}">${m} min</button>`).join("")}
    </div>
    <p class="para">${d.lvl.defi.txt}</p>
    <button class="do-btn ${done?'ok':''}" data-defi="${d.key}">${done?'✔ Validé — refaire':"J'ai relevé le défi ✓"}</button>
    <button class="ubtn ghost" style="margin-left:8px" data-another="${maxMin}">Autre défi ↻</button>
  </div>`;
  mount.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>mountDefi(mount,parseInt(b.dataset.time,10)));
  mount.querySelector("[data-another]").onclick=()=>mountDefi(mount,maxMin);
  mount.querySelector("[data-defi]").onclick=()=>{
    const key=d.key; const [cid,ln]=key.split(":");
    if(!isDone("defi:"+key)){ markDone("defi:"+key); addXP(2); setCompLevel(cid,parseInt(ln,10)); toast("+2 ★ · défi validé !"); }
    paintXP(); mountDefi(mount,maxMin);
  };
}

  body+=`<div>${v.body||""}</div>`;

  const compsTxt = (v.comps||[]).map(cid=>{ const cc=comp(cid); return cc?`${cc.ic} ${cc.name}`:cid; }).join(" · ");
  const done=!!prog["v"+v.v];
  SC.innerHTML=`<a class="back" onclick="UKE.go('dash')">← Tableau de bord</a>
    <span class="eyebrow alt">${p.tag} · ${p.style}</span>

    <div class="panel">
      <div class="goalrow"><span class="pill">Niveau <b>v${v.v}</b> — ${v.diff}</span><span class="pill">Travaille : <b>${compsTxt||"—"}</b></span></div>
      ${body}
      <button class="do-btn ${done?'ok':''}" data-piece="${id}:${v.v}">${done?'✔ Niveau validé — rejouer':"J'ai joué ce niveau ✓"}</button>
    </div>`;
  wireInteractions();
  SC.querySelector("[data-piece]").onclick=function(){
    const s=st(); if(!s.morceaux[id])s.morceaux[id]={}; if(!s.morceaux[id]["v"+v.v]){ s.morceaux[id]["v"+v.v]=true; save(s); addXP(3); (v.comps||[]).forEach(cid=>{ if(comp(cid)&&comp(cid).live) setCompLevel(cid,Math.min(compLevel(cid)+1, (comp(cid).levels||[]).length)); }); toast("+3 ★ · niveau joué !"); }
    paintXP(); screenMorceau(id,v.v);

  <div class="panel">
   <div class="q"><div class="qt">1. As-tu déjà joué d'un instrument à cordes (guitare, ukulélé…) ?</div>
     <div class="opts"><label class="opt"><input type="radio" name="p1" value="0"> Jamais</label><label class="opt"><input type="radio" name="p1" value="1"> Un peu, il y a longtemps</label><label class="opt"><input type="radio" name="p1" value="2"> Oui, je joue encore</label></div></div>
   <div class="q"><div class="qt">2. Sais-tu lire une tablature ou un diagramme d'accord ?</div>
     <div class="opts"><label class="opt"><input type="radio" name="p2" value="0"> Pas du tout</label><label class="opt"><input type="radio" name="p2" value="1"> Vaguement</label><label class="opt"><input type="radio" name="p2" value="2"> Oui, sans problème</label></div></div>
   <div class="q"><div class="qt">3. Peux-tu déjà former un accord et le faire sonner proprement ?</div>
     <div class="opts"><label class="opt"><input type="radio" name="p3" value="0"> Non</label><label class="opt"><input type="radio" name="p3" value="1"> Un ou deux, difficilement</label><label class="opt"><input type="radio" name="p3" value="2"> Oui, plusieurs</label></div></div>
   <div class="q"><div class="qt">4. Peux-tu garder un rythme régulier (taper dans les mains en mesure) ?</div>
     <div class="opts"><label class="opt"><input type="radio" name="p4" value="0"> Pas sûr</label><label class="opt"><input type="radio" name="p4" value="1"> À peu près</label><label class="opt"><input type="radio" name="p4" value="2"> Oui, facilement</label></div></div>
   <div class="q"><div class="qt">5. Ton objectif principal ?</div>
     <div class="opts"><label class="opt"><input type="radio" name="p5" value="0"> Jouer mes premiers accords</label><label class="opt"><input type="radio" name="p5" value="1"> Accompagner des chansons</label><label class="opt"><input type="radio" name="p5" value="2"> Jouer et chanter / aller loin</label></div></div>
   <button class="do-btn" data-place>Calculer mon point de départ →</button>
   <div class="result" data-presult></div>
  </div>`;
  SC.querySelector("[data-place]").onclick=function(){
    function val(n){ const el=SC.querySelector(`input[name="${n}"]:checked`); return el?parseInt(el.value,10):0; }
    const exp=val("p1"),read=val("p2"),chord=val("p3"),rhy=val("p4");
    const s=st();
    s.comps["accords"]={lvl:Math.min(chord, 2)};        // 0..2 départ accords
    s.comps["rythme"]={lvl:Math.min(rhy,2)};
    s.comps["posture"]={lvl: exp>=1?1:0};
    s.placed=true; save(s);
    const profil = (exp+read+chord+rhy)>=6?"faux débutant confirmé":((exp+read+chord+rhy)>=3?"débutant avec quelques bases":"grand débutant");
    const res=SC.querySelector("[data-presult]"); res.className="result show";
    res.innerHTML=`<h4 style="color:var(--navy-deep);font-size:18px;margin-bottom:6px">🎯 Profil : ${profil}</h4>
     <p class="para" style="margin:0">Ton programme est calé : <b>Accords</b> démarre au palier ${s.comps.accords.lvl}, <b>Rythmique</b> au palier ${s.comps.rythme.lvl}. Les défis déjà acquis te sont proposés « à revoir », pas imposés. Tu peux relancer ce test quand tu veux.</p>
     <button class="do-btn" style="margin-top:12px" onclick="UKE.go('dash')">Voir mon tableau de bord →</button>`;
    paintXP();
  };
  paintXP();
}

/* ---------- interactions communes (chords play, strum, métronome) ---------- */
function wireInteractions(){ wireDemos(document);
  document.querySelectorAll("[data-strum]").forEach(b=>b.onclick=()=>{ try{ strum(JSON.parse(b.dataset.strum)); }catch(e){} });
  document.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>playNote(b.dataset.note,0));
  document.querySelectorAll("[data-defi]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.defi, [cid,ln]=key.split(":");
    if(!isDone("defi:"+key)){ markDone("defi:"+key); addXP(2); setCompLevel(cid,parseInt(ln,10)); toast("+2 ★ · défi validé !"); }
    screenComp(cid);
  });
  document.querySelectorAll("[data-metro]").forEach(m=>{
    const startBtn=m.querySelector("[data-mstart]"), range=m.querySelector("[data-bpm]"), bpmv=m.querySelector("[data-bpmv]");
    range.oninput=()=>{ metro.bpm=parseInt(range.value,10); bpmv.textContent=range.value; };
    startBtn.onclick=()=>{ if(metro.on){ metroStop(); startBtn.textContent="▶ Démarrer"; startBtn.classList.remove("on"); } else { metro.bpm=parseInt(range.value,10); metroStart(); startBtn.textContent="■ Arrêter"; startBtn.classList.add("on"); } };
  });
}

/* ---------- Router ---------- */
function go(route){
  metroStop();
  route=route||"dash";
  const [name,a,b]=route.split(":");
  if(name==="dash") screenDash();
  else if(name==="placement") screenPlacement();
  else if(name==="comp") screenComp(a);
  else if(name==="morceau") screenMorceau(a,b);
  else if(name==="notions") screenNotions();
  else if(name==="accordage") screenAccordage();
  else screenDash();
  window.scrollTo(0,0);
  try{ history.replaceState(null,"","#"+route); }catch(e){}
}
function reset(){ if(confirm("Réinitialiser toute ta progression ?")){ mem=def(); try{localStorage.removeItem(KEY);}catch(e){} go("dash"); } }

window.UKE={go,reset};
go((location.hash||"#dash").replace("#",""));
})();
</script>
</body>
</html>
